name: Build & Verify LRgetBD-Pro Capacitor Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (Matches bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Setup Java JDK 21 (Temurin — Required by Capacitor 8.6.0 & AGP 8.13.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Android 36 Platform + Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies from bun.lock, Check TypeScript & Run Unit Tests
        run: |
          bun install --frozen-lockfile
          npm run lint
          npm test
          npx tsx --test src/services/queueEngine.test.ts

      - name: Run Production Web Build & Synchronize Capacitor Android Assets
        run: |
          npm run build
          test -f dist/index.html
          test -d android
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json

      - name: Compile Android Debug APK & Run Android Unit Tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --version --no-daemon
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Validate Debug APK Existence, Package Identity, Version, Contents, Signature & SHA-256
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "ERROR: APK file size ($FILE_SIZE bytes) is smaller than 1 MB!"
            exit 1
          fi

          unzip -l "$APK_PATH" | grep -q "assets/public/index.html"
          unzip -l "$APK_PATH" | grep -q "assets/capacitor.config.json"

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          AAPT2_BIN="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER_BIN="$BUILD_TOOLS_DIR/apksigner"
          test -x "$AAPT2_BIN"
          test -x "$APKSIGNER_BIN"

          BADGING=$("$AAPT2_BIN" dump badging "$APK_PATH")
          echo "$BADGING" | head -n 5

          echo "$BADGING" | grep -q "package: name='bd.landarchive.lrgetbdpro'"
          echo "$BADGING" | grep -q "versionCode='1'"
          echo "$BADGING" | grep -q "versionName='2.1.0'"

          "$APKSIGNER_BIN" verify --verbose "$APK_PATH"

          cp "$APK_PATH" ./LRgetBD-Pro-debug.apk
          sha256sum ./LRgetBD-Pro-debug.apk > ./LRgetBD-Pro-debug.apk.sha256
          SHA256_HASH=$(awk '{print $1}' ./LRgetBD-Pro-debug.apk.sha256)

          FILE_SIZE="$FILE_SIZE" SHA256_HASH="$SHA256_HASH" APK_PATH="$APK_PATH" node -e '
            const fs = require("fs");
            const meta = {
              project: "LRgetBD-Pro / LandArchive BD",
              repository: process.env.GITHUB_REPOSITORY || "tapos-linx/LR_Mass_Downloader",
              buildType: "debug",
              releaseSigned: false,
              signingType: "android-debug-keystore",
              apkFileName: "LRgetBD-Pro-debug.apk",
              sourceApkPath: process.env.APK_PATH,
              applicationId: "bd.landarchive.lrgetbdpro",
              versionCode: 1,
              versionName: "2.1.0",
              minSdk: 24,
              targetSdk: 36,
              compileSdk: 36,
              fileSizeBytes: Number(process.env.FILE_SIZE),
              sha256: process.env.SHA256_HASH,
              gitSha: process.env.GITHUB_SHA || "local",
              runNumber: process.env.GITHUB_RUN_NUMBER || "0",
              builtAtUtc: new Date().toISOString()
            };
            fs.writeFileSync("build-metadata.json", JSON.stringify(meta, null, 2) + "\n");
          '

          cat ./LRgetBD-Pro-debug.apk.sha256
          cat ./build-metadata.json

      - name: Upload Verified Debug APK, SHA-256 Checksum & Build Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LRgetBD-Pro-Debug-APK
          if-no-files-found: error
          path: |
            ./LRgetBD-Pro-debug.apk
            ./LRgetBD-Pro-debug.apk.sha256
            ./build-metadata.json

