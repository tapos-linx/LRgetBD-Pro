[package]
name = "tapos-linx/lrgetbd-pro"
version = "2.1.0"
description = "LRgetBD Pro — Nationwide Land Record Mass Downloader"
license = "MIT"

[[module]]
name = "server"
source = "."
abi = "wasi"

[dependencies]
"nodejs/nodejs" = "20.x"

[scripts]
start = "node server.ts"

[[commands]]
name = "serve"
module = "server"
runner = "https://webc.org/runner/nodejs"

[fs]
"/dist" = "dist"
"/src" = "src"
"server.ts" = "server.ts"
"package.json" = "package.json"

[env]
NODE_ENV = "production"
PORT = "3000"
